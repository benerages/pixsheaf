# Builds, signs, and publishes a release (project brief §Supply chain):
# native amd64 and arm64 images, a multi-arch index on GHCR signed with
# cosign (keyless), BuildKit SBOM (Syft) and SLSA provenance attestations
# per platform, a GitHub build provenance attestation, and a GitHub release
# with the changelog and the SBOMs.
#
# Push a tag vX.Y.Z to release. Run it by hand (workflow_dispatch) on a
# branch for a dry run: everything is built for both architectures, nothing
# is pushed. A manual run on a tag is a real release; patch-release.yml
# starts it that way, because a tag it creates triggers no workflow.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  PUSH: ${{ github.event_name == 'push' || github.ref_type == 'tag' }}

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [api, worker]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ github.ref_name }}
          # SBOM generated by BuildKit's Syft scanner and SLSA provenance,
          # attached to the image and covered by the cosign signature.
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/pixsheaf-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
      - name: Keep the digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.image }}
    if: github.event_name == 'push' || github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [api, worker]
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch index
        id: index
        env:
          IMAGE: ${{ env.REGISTRY }}/pixsheaf-${{ matrix.image }}
          NAME: pixsheaf-${{ matrix.image }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          sources=()
          for f in digests/*; do sources+=("$IMAGE@sha256:$(basename "$f")"); done
          [[ ${#sources[@]} -eq 2 ]] || { echo "expected 2 platform digests, got ${#sources[@]}" >&2; exit 1; }
          docker buildx imagetools create --tag "$IMAGE:$version" --tag "$IMAGE:${version%.*}" --tag "$IMAGE:latest" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" | sed -n 's/^Digest:[[:space:]]*\(sha256:[0-9a-f]\{64\}\).*/\1/p' | head -n 1)
          [[ -n $digest ]] || { echo "no index digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest" --format '{{ json .SBOM }}' > "sbom-$NAME.spdx.json"
          # The full reference for the release compose file.
          echo "$IMAGE:$version@$digest" > "ref-$NAME.txt"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the index (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/pixsheaf-${{ matrix.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE@$DIGEST"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/pixsheaf-${{ matrix.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-pixsheaf-${{ matrix.image }}.spdx.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ref-${{ matrix.image }}
          path: ref-pixsheaf-${{ matrix.image }}.txt
          retention-days: 1
          if-no-files-found: error

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ref-*
          merge-multiple: true
          path: refs
      - name: Write the release compose file
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          bash scripts/release-compose.sh "${TAG#v}" \
            "$(cat refs/ref-pixsheaf-api.txt)" "$(cat refs/ref-pixsheaf-worker.txt)" > dist/compose.yaml
          cat dist/compose.yaml
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          version=${TAG#v}
          {
            bash scripts/changelog.sh "$TAG" "$TAG" | tail -n +2
            printf '\n### Images\n\n'
            printf -- '- `%s/pixsheaf-api:%s`\n- `%s/pixsheaf-worker:%s`\n' "$REGISTRY" "$version" "$REGISTRY" "$version"
            printf '\nBoth for linux/amd64 and linux/arm64, pinned by digest in the `compose.yaml` attached below:\n\n```sh\n'
            printf 'curl -fsSLO https://github.com/%s/releases/download/%s/compose.yaml\ndocker compose up -d\n```\n' "$REPO" "$TAG"
            printf '\n### Verify\n\n```sh\n'
            printf 'cosign verify %s/pixsheaf-api:%s \\\n' "$REGISTRY" "$version"
            printf '  --certificate-identity-regexp '"'"'^https://github.com/%s/\\.github/workflows/release\\.yml@refs/tags/v'"'"' \\\n' "$REPO"
            printf '  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n'
            printf 'gh attestation verify oci://%s/pixsheaf-api:%s --repo %s\n```\n' "$REGISTRY" "$version" "$REPO"
            printf '\nThe same works for `pixsheaf-worker`. SPDX SBOMs for both platforms are attached to this release and to the images.\n'
          } > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "Pixsheaf ${TAG#v}" --notes-file notes.md dist/compose.yaml sbom/*.spdx.json
