# Builds both images, runs the container isolation tests, and scans the
# images for vulnerabilities. Nothing is pushed in Phase 2.
name: container

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rebuild so patched base packages are picked up (Mondays 04:17 UTC).
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-scan:
    name: Build, isolation test, Grype
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Worker tests against libvips
        run: docker build --file deploy/docker/worker.Dockerfile --target test .
      - name: Container isolation tests (runc)
        run: bash tests/container/run.sh
      - name: Release compose file is valid and has no build sections
        run: |
          d=$(printf '0%.0s' $(seq 64))
          bash scripts/release-compose.sh 0.0.0 \
            "ghcr.io/benerages/pixsheaf-api:0.0.0@sha256:$d" \
            "ghcr.io/benerages/pixsheaf-worker:0.0.0@sha256:$d" > /tmp/release-compose.yaml
          docker compose -f /tmp/release-compose.yaml config --quiet
          if grep -q 'build:' /tmp/release-compose.yaml; then echo "build section left" >&2; exit 1; fi
          [[ $(grep -c '@sha256:' /tmp/release-compose.yaml) -eq 2 ]]
      - name: End-to-end test (single image)
        run: |
          docker compose up --detach --build --wait
          bash tests/e2e/single-image.sh
          bash tests/e2e/batch.sh
      - name: Browser and accessibility tests (Playwright, axe-core)
        run: bash tests/e2e/ui.sh
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: |
          docker compose logs --no-color --tail 40
          docker compose down --volumes
      - name: Scan API image
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          image: ghcr.io/benerages/pixsheaf-api:latest
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Scan worker image
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          image: ghcr.io/benerages/pixsheaf-worker:latest
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
