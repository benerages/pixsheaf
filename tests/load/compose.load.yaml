# Load test overrides: one client (k6 on the host) runs several batches at
# once, so the per-client limits are raised. All other limits keep their
# defaults; the test shows whether the defaults hold under load.
services:
  api:
    environment:
      PIXSHEAF_REQUESTS_PER_MINUTE: "100000"
      PIXSHEAF_MAX_JOBS_PER_CLIENT: "100"
  worker:
    environment:
      PIXSHEAF_REQUESTS_PER_MINUTE: "100000"
      PIXSHEAF_MAX_JOBS_PER_CLIENT: "100"
